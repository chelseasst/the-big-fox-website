<app-banner-giftcard #giftCard  *ngIf="giftBannerVisible" (showBanner)="updateGiftBanner($event)"></app-banner-giftcard>

<site-header-desktop *ngIf="isDesktop; else mobile" [giftBannerShowed]="giftBannerVisible"></site-header-desktop>
  
<ng-template #mobile>
  <site-header-mobile [giftBannerShowed]="giftBannerVisible"></site-header-mobile>
</ng-template>
