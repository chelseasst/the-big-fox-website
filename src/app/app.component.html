<app-initial-popup *ngIf="showInitialPopup" (close)="closePopup()"></app-initial-popup>

<div class="popup-background" [ngClass]="{ popupShown: showInitialPopup }">
  <app-shopping-cart *ngIf="isCartVisible$ | async"></app-shopping-cart>
  <app-header></app-header>
  <router-outlet class="router-outlet"></router-outlet>
  <app-footer></app-footer>
</div>
