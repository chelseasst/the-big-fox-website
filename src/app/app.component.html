<div class="popup-background" [ngClass]="{ popupShown: showInitPopup }">
  <app-shopping-cart *ngIf="isCartVisible$ | async"></app-shopping-cart>
  <app-header></app-header>
  <router-outlet class="router-outlet"></router-outlet>
  <app-footer></app-footer>
  <app-initial-popup *ngIf="showInitPopup" (close)="closePopup()"></app-initial-popup>
</div>
