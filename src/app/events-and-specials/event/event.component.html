<div class="event-container">
  <div class="wrapper">
    <div class="photo">
      <p>
        <img [src]="url" alt="" />
      </p>
    </div>

    <div class="description">
      <p>{{ title }}</p>
      <p>{{ eventDate | date : "dd/MMM/yyyy" }}</p>
      <p><br />{{ days }}<br />{{ time }}</p>
    </div>
  </div>
</div>
